# Every parameter of the screenplay text analysis. Fixed on 2026-11-11, before any text was read
# for results. Changing a value is a new analysis: log why in LOG.md.

seed: 20261112

sample:
  tier: "100k+"                  # features/movies_features.csv; the 10k tier's money isn't validated
  # Clean theatrical rule, as in scripts/imdb/coverage_clean_sample.sql
  min_budget_usd: 1000
  max_year_exclusive: 2026
  streaming_distributors: "netflix|amazon|apple|hulu"
  duplicate_rule: "longest_script"   # 12 IMDb IDs appear twice in MovieSum
  expected:                          # reproduced 2026-11-11, see LOG.md
    clean_movies: 2446
    clean_with_usable_script: 1095
    gross_below_budget: 67
    global_quartile_bottom: 243
    global_quartile_top: 306

groups:
  # Quartile cut-offs are computed on ALL clean movies (scripted or not) and then applied to the
  # scripted ones. This is how 243 / 306 arise, and it keeps a film's label independent of
  # whether other films in its cell happen to have a script.
  quartile_cut_basis: "all_clean"
  # (C) cells
  decade_bins: [[0, 1979, "pre-1980"], [1980, 1989, "1980s"], [1990, 1999, "1990s"],
                [2000, 2009, "2000s"], [2010, 2019, "2010s"], [2020, 2025, "2020s"]]
  min_clean_movies_per_cell: 20     # a genre x decade cell needs this many clean movies to cut quartiles
  min_scripts_per_group: 30         # rule from the brief for reporting (C) within one genre or decade
  # Primary genre: IMDb lists a film's genres alphabetically, so "first-listed" is "alphabetically
  # first" (Action and Adventure win, Drama almost never). We use the brief's seven genres in a fixed
  # priority order instead, rarest first in the 1,095 scripts, so the most specific label wins.
  # Àngela's reviews analysis uses first-listed; agreement between the two rules is reported.
  primary_genre_priority: ["Horror", "Sci-Fi", "Thriller", "Adventure", "Action", "Comedy", "Drama"]
  other_genre: "Other"

text:
  min_scenes_flag: 20               # fewer scene tags = markup probably missing (flagged, not dropped)
  min_dialogue_words: 500           # fewer = dialogue not tagged (e.g. Casablanca's whole layer is "THE END");
                                    # added 2026-11-11 after Step 2, before any word result; excluded and counted
  layers: ["dialogue", "action", "full"]
  token_regex: "[A-Za-z]+(?:'[A-Za-z]+)?"   # same tokenizer as analysis/reviews
  lowercase: true
  min_token_length: 2
  normalise_split_contractions: true        # "do n't" -> "don't" in pre-tokenised scripts
  spacy_model: "en_core_web_sm"
  spacy_batch_chars: 100000                 # scripts are processed in chunks of about this many characters
  variants:
    stopwords: ["kept", "removed"]          # primary: kept (function words carry style)
    lemmatize: ["off", "on"]                # primary: off
  names:
    source_primary: "moviesum_labels"
    source_check: "spacy_ner_person"
    min_label_lines: 1

scattertext:
  rate_per: 10000
  smoothing_per_10k: 0.1           # added to both rates before the ratio, about one use per 100,000 words
  smoothing_presence: 0.005        # same, for the share-of-scripts version
  score: "log10_rate_ratio"        # log10((rate_high + e) / (rate_low + e)); same scale as analysis/reviews
  threshold: 0.30103               # log10(2): a term at least twice as frequent in one group
  min_doc_freq_grid: [3, 5, 10]
  count_modes: ["repeated", "presence"]
  top_n: 50
  snippets_in_html: false

primary:
  definition: "C"
  layer: "dialogue"
  names_removed: true
  stopwords: "kept"
  lemmatize: "off"
  min_doc_freq: 5
  count_mode: "repeated"

shuffle_null:
  shuffles: 1000
  stratified: true                 # permute labels among labelled films within each genre x decade cell

stability:
  subsamples: 100
  top_n: 50
  matching_calipers: [0.25, 0.5, 1.0]   # in standard deviations of log budget

matching:
  exact: ["primary_genre", "decade_bin"]
  caliper_sd_log_budget: 0.5
  with_replacement: false

logreg:
  folds: 5
  repeats: 10
  permutations: 200
  C_grid: [0.01, 0.1, 1.0, 10.0]
  max_features: 20000

kwic:
  window_words: 7                  # 7 left + term + 7 right = 15 words
  per_term: 5
  top_terms_per_side: 15

validation:
  scripts: 25
  terms: 30
