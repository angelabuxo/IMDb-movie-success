# Every parameter of the embedding analysis (reviews, screenplays and summaries against profit and revenue).
# Fixed on 2026-11-16 before any result was computed. Changing a value is a new analysis.

seed: 20261116

sample:
  table: "movies_features_10k.csv"   # every movie with 10,000+ IMDb votes; the tier column marks 100k+
  # The clean theatrical rule itself is analysis/clean_rule.py, shared by every analysis.

controls:
  min_films_per_genre: 50            # an IMDb genre needs this many films in the sample to get a dummy
  decade_bins: [[0, 1979, "pre-1980"], [1980, 1989, "1980s"], [1990, 1999, "1990s"],
                [2000, 2009, "2000s"], [2010, 2019, "2010s"], [2020, 2025, "2020s"]]
  primary_genre_priority: ["Horror", "Sci-Fi", "Thriller", "Adventure", "Action", "Comedy", "Drama"]
  min_films_per_cell: 20             # smaller genre x decade cells are pooled before the stratified shuffle

clean:
  token_regex: "[A-Za-z]+(?:'[A-Za-z]+)?"   # same tokenizer as analysis/scripts_text
  reviews:
    per_film: 30                     # a seeded random sample of each film's valid reviews (reservoir sampling)
    min_per_film: 5
    min_words: 30
    min_ascii_letter_share: 0.9      # language filter, with min_english_function_words
    min_english_function_words: 3
  screenplays:
    min_words: 3000                  # fewer cleaned words means the markup failed or the script is a fragment
    name_max_lowercase_share: 0.1    # a speaker-label word is a name if it is almost never written in lower case
    name_min_count: 3
    name_min_length: 3
    ner_check_scripts: 40            # the label rule is compared with spaCy's PERSON tags on this many scripts
    ner_check_words: 3000
  summaries:
    min_words: 100
  other_names:                     # titles and people of OTHER films named in a review (added 2026-11-16, post hoc)
    min_title_chars: 8              # a title needs two words and this many characters to be masked as a phrase
    single_min_count: 20            # a single title or name word is masked on its own only if it occurs this often,
    single_max_lowercase_share: 0.1 # is almost always capitalised,
    single_min_share_in_full_name: 0.2   # and at least this share of its uses are inside the full title or name
    single_min_length: 4
    context_sentences: 20               # spaCy reads each single word in this many review mentions; a word it mostly
                                        # types as a place, a group (nationality, religion) or a time is not masked
    entity_model: "en_core_web_trf"     # chosen over en_core_web_sm on the tag hand labels (outputs/tag_entity_typing.json)
    famous_director_min_films: 8        # the surname of a director with this many films in the Genome needs only
                                        # to be capitalised (not used inside the full name), if
    famous_director_min_lift: 5         # reviews of the director's own films use it this many times more often
  other_title_placeholder: "another film"
  extra_names: ["Brando", "Churchill"]   # added by hand after the leak audit (s04, 2026-11-16): real people named
                                         # alone in screenplays, which neither name rule catches
  spacy_model: "en_core_web_sm"
  name_placeholder: "Person"
  title_placeholder: "the film"

embed:
  model: "all-MiniLM-L6-v2"          # the model behind the vectors already in features/, so results compare
  passage_words: 180                 # the model reads at most 256 word pieces, about 190 English words
  min_last_passage_words: 30
  batch_size: 256

tfidf:                               # second method: a bag-of-words space built from the same cleaned text
  min_df: 5
  max_df: 0.8
  max_features: 50000
  sublinear_tf: true
  stop_words: "english"
  svd_components: 300

analysis:
  pca_components: 50
  pca_grid: [10, 20, 50, 100]
  ridge_alphas: [-2, 4, 25]          # numpy.logspace arguments
  folds: 5
  repeats: 10
  permutations: 500
  bootstrap: 1000
  knn: 10
  time_split_train_share: 0.7        # earliest 70% of films by year train, the rest test
  top_words: 15
  word_min_doc_freq: 20

# Added 2026-11-16 AFTER the first results, and labelled as such everywhere they are used. Two problems
# showed up in the first word lists: OCR-damaged screenplays ("gest:ure", "t~e") gave the "profitable" end of
# the screenplay direction, and the review direction's top words were sequel vocabulary.
post_hoc:
  max_ocr_damaged_word_share: 0.005   # 92 of 1,630 scripts above it (95th percentile 0.0054); clean.junk_share
  franchise_control: true             # features/franchise.csv joins the controls in the primary specification
